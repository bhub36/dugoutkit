<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Avenir Next','Helvetica Neue',sans-serif; background:#F7F4EE; color:#1C2126;
       display:flex; align-items:center; justify-content:center; min-height:100vh; }
.demo { width:min(96vw, 680px); }
.cap { font-size:14px; font-weight:700; color:#6E7681; letter-spacing:1px; margin-bottom:10px; }
.cap span { color:#C8102E; }
.sheet { background:#fff; border-radius:12px; box-shadow:0 14px 36px rgba(26,43,69,.22); overflow:hidden; }
.bar { background:#1A2B45; padding:10px 16px; color:#fff; font-size:14px; font-weight:600; display:flex; gap:9px; align-items:center; }
.dot { width:10px; height:10px; border-radius:50%; background:#C8102E; }
table { width:100%; border-collapse:collapse; font-size:14.5px; }
th { background:#2E4A73; color:#fff; padding:9px 12px; text-align:left; font-weight:600; }
td { padding:8px 12px; border-bottom:1px solid #E8EDF5; }
tr.new-row { animation:pop .45s ease; }
tr.hidden { display:none; }
@keyframes pop { from { background:#FBE9EC; } to { background:transparent; } }
.pos { color:#1A2B45; font-weight:700; } .accent { color:#C8102E; font-weight:700; }
.kpis { display:flex; gap:12px; margin-top:14px; }
.kpi { background:#fff; border-radius:10px; padding:12px 16px; flex:1; box-shadow:0 8px 20px rgba(26,43,69,.13); }
.kpi .l { font-size:10.5px; color:#6E7681; font-weight:700; letter-spacing:.8px; }
.kpi .v { font-size:26px; color:#1A2B45; font-weight:700; margin-top:2px; transition:transform .2s; }
.kpi .v.bump { transform:scale(1.12); color:#C8102E; }
.rankbadge { display:inline-block; background:#C8102E; color:#fff; border-radius:50%; width:24px; height:24px;
             text-align:center; line-height:24px; font-weight:700; font-size:13px; }
.foot { margin-top:10px; font-size:12px; color:#6E7681; text-align:center; }
</style></head><body>
<div class="demo">
<div class="cap">LIVE DEMO — <span>log a game, stats build themselves</span></div>
<div class="sheet"><div class="bar"><span class="dot"></span>Hitting Log — Player Season HQ</div>
<table id="t"><tr><th>Game</th><th>AB</th><th>H</th><th>AVG</th><th>OBP</th><th>OPS</th></tr></table></div>
<div class="kpis">
<div class="kpi"><div class="l">SEASON AVG</div><div class="v" id="k0">—</div></div>
<div class="kpi"><div class="l">SEASON OBP</div><div class="v" id="k1">—</div></div>
<div class="kpi"><div class="l">SEASON OPS</div><div class="v" id="k2">—</div></div>
</div>
<div class="foot">You type the chalk columns. Everything else is automatic — all season.</div>
</div>
<script>
// per game: [opp, AB, H, TB, BB, HBP]
const G = [["vs Rivertown",3,2,3,1,0],["@ Lakeside",4,1,1,0,0],["vs North HS",3,1,2,1,0],
           ["@ Falcons",4,2,5,0,1],["vs Millbrook",3,0,0,1,0],["@ Eastside",4,2,3,0,0],
           ["vs Harbor",3,2,6,1,0],["@ Rivertown",4,1,1,1,1]];
function cum(n){ let ab=0,h=0,tb=0,bb=0,hbp=0;
  for(let i=0;i<=n;i++){ ab+=G[i][1]; h+=G[i][2]; tb+=G[i][3]; bb+=G[i][4]; hbp+=G[i][5]; }
  const avg=h/ab, obp=(h+bb+hbp)/(ab+bb+hbp), slg=tb/ab;
  return [avg,obp,obp+slg]; }
const f3=x=>x>=1? x.toFixed(3):x.toFixed(3).slice(1);
function render(step, animate){
  const t=document.getElementById('t');
  while(t.rows.length>1)t.deleteRow(1);
  for(let i=0;i<=step&&i<G.length;i++){
    const [avg,obp,ops]=cum(i);
    const r=t.insertRow(-1);
    if(animate&&i===step)r.className='new-row';
    r.innerHTML=`<td>${G[i][0]}</td><td>${G[i][1]}</td><td>${G[i][2]}</td>`+
      `<td class="pos">${f3(avg)}</td><td>${f3(obp)}</td><td class="accent">${f3(ops)}</td>`;
  }
  if(step>=0){ const [avg,obp,ops]=cum(Math.min(step,G.length-1));
    [f3(avg),f3(obp),f3(ops)].forEach((v,j)=>{
      const el=document.getElementById('k'+j); el.textContent=v;
      if(animate){ el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),250);} });
  } else { for(let j=0;j<3;j++)document.getElementById('k'+j).textContent='—'; }
}
const q=new URLSearchParams(location.search);
if(q.has('f')){ render(parseInt(q.get('f'))-1,false); }
else { let s=-1;
  setInterval(()=>{ s=s>=G.length+1? -1 : s+1; render(Math.min(s,G.length-1),true); }, 950); }
</script></body></html>
